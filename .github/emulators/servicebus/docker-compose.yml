# Azure Service Bus emulator + SQL backing store for the SourceFlow.Cloud.Azure tests (pinned; see ../README.md).
# Entities must be pre-declared in Config.json; the emulator cannot create them at runtime.
services:
  sb-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2
    volumes:
      - "./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    depends_on:
      sqledge:
        condition: service_started

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:2.0.0
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
