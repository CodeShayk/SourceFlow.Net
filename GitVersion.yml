next-version: 3.0.0
tag-prefix: '[vV]'
mode: ContinuousDeployment
branches:
  master:
    regex: ^master$|^main$
    tag: ''
    source-branches: ['develop']
  release:
    mode: ContinuousDelivery
    tag: 'beta'
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    source-branches: ['master', 'develop']
  pre-release:
    regex: ^pre-release$|^pre-release/.*
    tag: alpha
    increment: Minor
    prevent-increment-of-merged-branch-version: true
    source-branches: ['master', 'develop']
  develop:
    regex: ^develop$|^dev$
    tag: beta
    increment: Minor
    source-branches: ['master']
  pull-request:
    tag: PullRequest
    tag-number-pattern: '[/-](?<number>\d+)'
    increment: Inherit
    regex: ^(pull|pull\-requests|pr)[/-]
    source-branches: ['master', 'develop', 'release', 'pre-release']
  v3:
    # v3.0.0 integration branch (implementation plan 02 §2). Switch tag to 'rc' at M6 (WP-6.3).
    regex: ^v3\.0\.0$
    tag: alpha
    increment: None
    prevent-increment-of-merged-branch-version: true
    source-branches: ['master']
  v3-work:
    # Work-package branches: v3/<wp-id>-<slug> (implementation plan 02 §1)
    regex: ^v3/
    tag: '{BranchName}'
    increment: Inherit
    source-branches: ['v3']
  feature:
    tag: '{BranchName}'
    increment: Inherit
    source-branches: ['master', 'develop', 'release']
ignore:
  sha: []